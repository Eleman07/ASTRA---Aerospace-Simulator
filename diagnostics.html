<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASTRA | Diagnostica Pyodide 1.3.3</title>
<style>
:root{color-scheme:dark}body{font:15px system-ui,Arial,sans-serif;margin:0 auto;padding:clamp(18px,5vw,45px);max-width:820px;background:#0b1020;color:#e7ecfa;line-height:1.65}h1{margin:0 0 8px;font-size:26px}p{color:#bac8e6}button{border:1px solid #6a7fc0;background:#243b71;color:#fff;padding:12px 17px;cursor:pointer;border-radius:9px;margin:8px 8px 8px 0;font:inherit}#log{white-space:pre-wrap;overflow-wrap:anywhere;background:#121c32;border:1px solid #3d5079;border-radius:10px;padding:16px;font:13px ui-monospace,Consolas,monospace;min-height:140px}.ok{color:#93e8ae}.bad{color:#ff9e9e}a{color:#98beff}
</style></head><body>
<h1>ASTRA · Pyodide Diagnostics</h1>
<p>Test del motore Python locale. Questa pagina non richiede l'API del server. Versione patch: <strong>1.3.3</strong>.</p>
<button id="run">Verifica file e avvio motore</button>
<button id="clear">Svuota cache ASTRA precedente</button>
<p id="status">Premi «Verifica file e avvio motore».</p>
<pre id="log"></pre>
<p><a href="./">Torna ad ASTRA</a></p>
<script type="module">
const out=document.querySelector('#log'), status=document.querySelector('#status');
function log(msg,ok){const line=document.createElement('div');line.textContent=msg;if(ok===true)line.className='ok';if(ok===false)line.className='bad';out.append(line)}
async function run(){out.textContent='';status.textContent='Verifica in corso…';
  log('URL: '+location.href);log('Browser: '+navigator.userAgent);
  if('serviceWorker' in navigator){try{const regs=await navigator.serviceWorker.getRegistrations();log('Service workers registrati: '+regs.length);for(const reg of regs)log('Worker: '+(reg.active?.scriptURL||reg.installing?.scriptURL||'(inattivo)'));}catch(e){log('Service worker check: '+e.message,false)}}
  let ok=true;
  for(const file of ['browser-api.js','browser-engine-worker.js','vendor/pyodide/pyodide.mjs','vendor/pyodide/pyodide.asm.mjs','vendor/pyodide/pyodide.asm.wasm','vendor/pyodide/python_stdlib.zip','vendor/pyodide/pyodide-lock.json','browser-python-files.json']){
    try{const r=await fetch(new URL(file,location.href),{method:'HEAD',cache:'no-store'});const type=r.headers.get('content-type')||'';const valid=r.ok && !type.includes('text/html');log(`${valid?'OK':'ERRORE'}  ${r.status}  ${file}  [${type}]`,valid);if(!valid)ok=false;}catch(e){log(`ERRORE ${file}: ${e.message}`,false);ok=false}
  }
  if(!ok){status.textContent='File mancanti o non validi: controlla il deploy su GitHub Actions.';return}
  status.textContent='File presenti. Avvio Module Worker…';
  const worker=new Worker(new URL('./browser-engine-worker.js?diag=133',location.href),{type:'module'});
  const limit=setTimeout(()=>{log('TIMEOUT: il motore non ha risposto in 45 secondi',false);status.textContent='Errore o ritardo di avvio';worker.terminate()},45000);
  worker.onmessage=(e)=>{const m=e.data||{};if(m.kind==='ready'){clearTimeout(limit);log('PYODIDE READY: Python '+m.python,true);status.textContent='Motore Python avviato correttamente';worker.terminate()}else if(m.kind==='boot_error'){clearTimeout(limit);log('ERRORE PYODIDE: '+m.error,false);status.textContent='Avvio fallito';worker.terminate()}};
  worker.onerror=(e)=>{clearTimeout(limit);log('ERRORE MODULE WORKER: '+(e.message||'Import moduli fallito')+' @ '+(e.filename||'')+':'+e.lineno,false);status.textContent='Avvio fallito';worker.terminate()};
}
document.querySelector('#run').onclick=run;
document.querySelector('#clear').onclick=async()=>{if(!confirm('Cancellare le cache e i service worker ASTRA memorizzati nel browser? Rimuove anche i file disponibili offline.'))return;
  let removed=0;
  if('caches'in window){for(const key of await caches.keys()){if(key.startsWith('astra-browser-')){await caches.delete(key);removed++}}}
  if('serviceWorker'in navigator){for(const reg of await navigator.serviceWorker.getRegistrations()){if(reg.scope.startsWith(new URL('./',location.href).href)){await reg.unregister();removed++}}}
  out.textContent='';log('Cache/worker ASTRA eliminati: '+removed,true);status.textContent='Chiudi le schede ASTRA e riapri il simulatore per reinstallare la versione aggiornata.';
};
</script></body></html>
