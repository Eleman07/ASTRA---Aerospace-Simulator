name: Deploy ASTRA Browser to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download Pyodide core for on-device Python and offline mode
        run: python3 tools/prepare_pyodide.py
      - name: Check assets and JavaScript syntax
        run: |
          python3 tools/test_browser_distribution.py
          node --check app.js
          node --check browser-api.js
          node --check browser-engine-worker.js
          node --check service-worker.js
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
